<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>我的</title>
    <link rel="stylesheet" href="/chat.css">
    <style>
        .main-content {
            min-height: 70vh;
            padding: 48px 24px 100px 24px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e0eafc;
            display: inline-block;
            margin: 24px 0 12px 0;
            font-size: 2.5rem;
            color: #4f8cff;
            line-height: 80px;
            font-weight: bold;
        }
        .user-info {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 18px;
        }
        .logout-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 28px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 18px;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .nav-bar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100vw;
            max-width: 700px;
            background: #fff;
            border-top: 1px solid #e0eafc;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            z-index: 100;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-item {
            flex: 1;
            text-align: center;
            color: #4f8cff;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 10px 0;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            border-radius: 12px;
            margin: 0 6px;
            text-decoration: none;
            display: block;
        }
        .nav-item.active {
            color: #fff;
            background: #4f8cff;
        }
        @media (max-width: 700px) {
            .main-content, .nav-bar {
                max-width: 100vw;
            }
        }
        @media (max-width: 600px) {
            .main-content {
                padding: 24px 6px 80px 6px;
            }
            .nav-bar {
                height: 52px;
            }
            .nav-item {
                font-size: 1rem;
                padding: 7px 0;
            }
        }
    </style>
</head>
<body>
<div class="main-content">
    <div class="user-avatar" id="user-avatar">U</div>
    <div class="user-info" id="user-info">加载中...</div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
</div>
<div class="nav-bar">
    <a class="nav-item" href="/index">首页</a>
    <a class="nav-item" href="#" style="pointer-events:none;opacity:0.5;">我的分析</a>
    <a class="nav-item active" href="/me">我的</a>
</div>
<script>
function getMe() {
    fetch('/auth/me').then(r => r.json()).then(d => {
        if(d.code!==0){
            window.location.href = '/auth';
            return;
        }
        var user = d.data;
        document.getElementById('user-info').innerText = '用户名：' + user.username;
        document.getElementById('user-avatar').innerText = user.username ? user.username[0].toUpperCase() : 'U';
    });
}
function logout() {
    fetch('/auth/logout').then(r => r.json()).then(d => {
        window.location.href = '/auth';
    });
}
getMe();
</script>
</body>
</html>
