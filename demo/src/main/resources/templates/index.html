<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>首页</title>
    <link rel="stylesheet" href="/chat.css">
    <style>
                .chat-card {
                    margin: 32px auto 0 auto;
                    max-width: 420px;
                    background: #f7faff;
                    border-radius: 18px;
                    box-shadow: 0 2px 12px rgba(79,140,255,0.08);
                    padding: 28px 20px 20px 20px;
                    text-align: left;
                    border: 1.5px solid #e0eafc;
                    transition: box-shadow 0.2s, border 0.2s;
                    cursor: pointer;
                }
                .chat-card:hover {
                    box-shadow: 0 4px 24px rgba(79,140,255,0.16);
                    border: 1.5px solid #4f8cff;
                }
                .chat-card-title {
                    font-size: 1.25rem;
                    color: #4f8cff;
                    font-weight: 700;
                    margin-bottom: 8px;
                }
                .chat-card-desc {
                    color: #333;
                    font-size: 1.05rem;
                    margin-bottom: 0;
                }
        .main-content {
            min-height: 70vh;
            padding: 48px 24px 100px 24px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .main-content h1 {
            font-size: 2.2rem;
            margin-top: 32px;
            color: #4f8cff;
        }
        .main-content p {
            font-size: 1.15rem;
            color: #333;
            margin-top: 18px;
        }
        .nav-bar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100vw;
            max-width: 700px;
            background: #fff;
            border-top: 1px solid #e0eafc;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 60px;
            z-index: 100;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-item {
            flex: 1;
            text-align: center;
            color: #4f8cff;
            font-size: 1.15rem;
            font-weight: 500;
            padding: 10px 0;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            border-radius: 12px;
            margin: 0 6px;
            text-decoration: none;
            display: block;
        }
        .nav-item.active {
            color: #fff;
            background: #4f8cff;
        }
        @media (max-width: 700px) {
            .main-content, .nav-bar {
                max-width: 100vw;
            }
        }
        @media (max-width: 600px) {
            .main-content {
                padding: 24px 6px 80px 6px;
            }
            .nav-bar {
                height: 52px;
            }
            .nav-item {
                font-size: 1rem;
                padding: 7px 0;
            }
        }
    </style>
</head>
<body>
<div class="main-content">
    <h1>欢迎来到首页</h1>
    <p>这里是心理AI系统的首页。</p>
    <div class="chat-card" onclick="gotoChat()">
        <div class="chat-card-title">AI 聊天</div>
        <div class="chat-card-desc">点击进入与心理AI助手对话，获得智能心理支持。</div>
    </div>
<script>
// 生成唯一id
function uuidv4() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}
function gotoChat() {
    var id = uuidv4();
    window.location.href = '/chat?sid=' + id;
}
</script>
</div>
<div class="nav-bar">
    <a class="nav-item active" href="/index">首页</a>
    <a class="nav-item" href="/history">历史记录</a>
    <a class="nav-item" href="/me">我的</a>
</div>
</body>
</html>
